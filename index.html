<!DOCTYPE html>

<title>写真を送る</title>
<style>
  :root { --main:#2f6f5e; --main-dark:#235446; --bg:#f6f4ef; --text:#222; --sub:#666; --err:#b3412e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:480px; margin:0 auto; padding:28px 20px 40px; }
  h1 { font-size:24px; margin:0 0 6px; }
  .lead { color:var(--sub); margin:0 0 24px; line-height:1.6; font-size:15px; }
  .btn { display:block; width:100%; padding:20px; margin:0 0 14px; border:none; border-radius:14px;
         font-size:19px; font-weight:bold; color:#fff; background:var(--main); text-align:center; cursor:pointer; }
  .btn:active { background:var(--main-dark); }
  .btn.sub { background:#fff; color:var(--main); border:2px solid var(--main); }
  .btn[hidden], input[type=file] { display:none; }
  .card { background:#fff; border-radius:14px; padding:20px; margin-top:10px; }
  .count { font-size:22px; font-weight:bold; margin:0 0 12px; }
  .bar { height:14px; background:#e4e1d8; border-radius:7px; overflow:hidden; }
  .bar > div { height:100%; width:0; background:var(--main); transition:width .3s; }
  .note { color:var(--sub); font-size:14px; line-height:1.6; margin:12px 0 0; }
  .msg { font-size:17px; line-height:1.7; margin:0; }
  .err { color:var(--err); }
  .done { font-size:22px; font-weight:bold; color:var(--main); margin:0 0 6px; }
</style>
</head>
<body>
<main>
  <h1 id="title">写真を送る</h1>
  <p class="lead" id="lead">ボタンを押して写真を選ぶと、すぐに送信が始まります。何枚でもまとめて選べます。送信中は、この画面を開いたままにしてください。</p>

  <div id="actions" hidden>
    <label class="btn" for="pick">写真を選んで送る</label>
    <label class="btn sub" for="camera">カメラで撮って送る</label>
    <input type="file" id="pick" accept="image/*" multiple>
    <input type="file" id="camera" accept="image/*" capture="environment">
  </div>

  <div class="card" id="status" hidden>
    <p class="count" id="count"></p>
    <div class="bar"><div id="bar"></div></div>
    <p class="note" id="note"></p>
  </div>

  <div class="card" id="info" hidden><p class="msg" id="infoText"></p></div>
</main>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwSNGSu92yhqqUFqLBjBqy8-tgiQAAwwv9tB9oJ5Bigo4Xc_a40fGZelHq3WqIcqddJeQ/exec';
const PAGE_TITLE = '写真を送る';
/**
 * JPEG写真から位置情報（GPS）だけを取り除く。
 * 画像データ本体には一切触れないので、画質は変わらない。
 * 撮影日時や向き（回転）などの情報はそのまま残す。
 * 戻り値: { buf: ArrayBuffer, removed: boolean, isJpeg: boolean }
 */
function stripGps(input) {
  const u8 = new Uint8Array(input.slice(0));
  const dv = new DataView(u8.buffer);
  if (u8.length < 4 || dv.getUint16(0) !== 0xFFD8) return { buf: u8.buffer, removed: false, isJpeg: false };

  const SIZES = { 1: 1, 2: 1, 3: 2, 4: 4, 5: 8, 6: 1, 7: 1, 8: 2, 9: 4, 10: 8, 11: 4, 12: 8 };
  let removed = false;
  let off = 2;

  while (off + 4 <= u8.length && u8[off] === 0xFF) {
    const marker = u8[off + 1];
    if (marker === 0xDA || marker === 0xD9) break; // 画像データの始まり／終わり
    if (marker === 0xFF) { off += 1; continue; }   // 詰め物
    const len = dv.getUint16(off + 2);
    const segStart = off + 4;
    const segEnd = off + 2 + len;
    if (segEnd > u8.length) break;

    if (marker === 0xE1) {
      // EXIF
      if (len >= 16 && ascii(u8, segStart, 6) === 'Exif\0\0') {
        if (wipeExifGps(u8, dv, segStart + 6, segEnd, SIZES)) removed = true;
      }
      // XMP（位置情報が入っていれば中身を空白で塗りつぶす）
      const xmpNs = 'http://ns.adobe.com/xap/1.0/\0';
      if (ascii(u8, segStart, xmpNs.length) === xmpNs) {
        const body = ascii(u8, segStart + xmpNs.length, segEnd - segStart - xmpNs.length);
        if (/GPSLatitude|GPSLongitude|GPSPosition/.test(body)) {
          u8.fill(0x20, segStart + xmpNs.length, segEnd);
          removed = true;
        }
      }
    }
    off = segEnd;
  }
  return { buf: u8.buffer, removed, isJpeg: true };
}

function wipeExifGps(u8, dv, tiff, end, SIZES) {
  if (tiff + 8 > end) return false;
  const bo = dv.getUint16(tiff);
  if (bo !== 0x4949 && bo !== 0x4D4D) return false;
  const le = bo === 0x4949;
  const g16 = o => dv.getUint16(o, le);
  const g32 = o => dv.getUint32(o, le);
  const inRange = (o, n) => o >= tiff && o + n <= end;

  const ifd0 = tiff + g32(tiff + 4);
  if (!inRange(ifd0, 2)) return false;
  const n = g16(ifd0);
  for (let i = 0; i < n; i++) {
    const e = ifd0 + 2 + i * 12;
    if (!inRange(e, 12)) return false;
    if (g16(e) !== 0x8825) continue; // GPS情報の場所を示すタグ

    const gps = tiff + g32(e + 8);
    if (!inRange(gps, 2)) return false;
    const m = g16(gps);
    for (let j = 0; j < m; j++) {
      const ge = gps + 2 + j * 12;
      if (!inRange(ge, 12)) break;
      const size = (SIZES[g16(ge + 2)] || 1) * g32(ge + 4);
      if (size > 4) {
        const vo = tiff + g32(ge + 8);
        if (inRange(vo, size)) u8.fill(0, vo, vo + size); // 座標などの値を消す
      }
      u8.fill(0, ge, ge + 12); // 項目自体を消す
    }
    dv.setUint16(gps, 0, le); // GPS項目の数を0にする
    return m > 0;
  }
  return false;
}

function ascii(u8, start, n) {
  let s = '';
  const stop = Math.min(u8.length, start + n);
  for (let i = start; i < stop; i++) s += String.fromCharCode(u8[i]);
  return s;
}

</script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const MAX_BYTES = 35 * 1024 * 1024;
  const RETRY_WAIT = [2, 5, 10, 20, 40]; // 失敗したときに待つ秒数
  const PARALLEL = 3; // 同時に送る枚数

  document.title = PAGE_TITLE;
  $('title').textContent = PAGE_TITLE;

  // 合言葉はQRコードのURL（#k=...）から読み取る。サーバーには送られない部分なので記録に残りにくい。
  const hashKey = new URLSearchParams(location.hash.slice(1)).get('k');
  if (hashKey) { try { localStorage.setItem('k', hashKey); } catch (e) {} }
  let key = hashKey;
  if (!key) { try { key = localStorage.getItem('k'); } catch (e) {} }
  if (hashKey) history.replaceState(null, '', location.pathname); // 画面上のURLから合言葉を消す

  const queue = [];
  let running = false;
  let total = 0, sent = 0, skipped = 0, failed = 0;
  let batchId = newBatchId();
  let batchCount = 0;
  let wakeLock = null;
  let runStart = 0, runDone = 0;

  function newBatchId() {
    const a = new Uint8Array(10); crypto.getRandomValues(a);
    return Array.from(a, x => (x % 36).toString(36)).join('');
  }

  function sentSet() {
    try { return new Set(JSON.parse(localStorage.getItem('sent') || '[]')); } catch (e) { return new Set(); }
  }
  function markSent(h) {
    try { const s = sentSet(); s.add(h); localStorage.setItem('sent', JSON.stringify([...s])); } catch (e) {}
  }

  function showInfo(text, isErr) {
    $('info').hidden = false;
    $('infoText').textContent = text;
    $('infoText').className = 'msg' + (isErr ? ' err' : '');
  }

  async function post(body) {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ key }, body))
    });
    return res.json();
  }

  async function start() {
    if (!key) {
      showInfo('このページは、配られたQRコードから開いてください。', true);
      return;
    }
    try {
      const r = await post({ action: 'ping' });
      if (!r.ok) {
        showInfo(r.error === 'closed' ? '受付期間外のため、いまは写真を送れません。'
                                      : 'このQRコードは使えなくなっています。配った人に確認してください。', true);
        return;
      }
    } catch (e) {
      // 電波が悪いだけの可能性があるので、ボタンは出しておく
    }
    $('actions').hidden = false;
  }

  function onPick(ev) {
    const files = Array.from(ev.target.files || []);
    ev.target.value = '';
    if (!files.length) return;
    files.forEach(f => queue.push(f));
    total += files.length;
    $('info').hidden = true;
    render();
    if (!running) run();
  }
  $('pick').addEventListener('change', onPick);
  $('camera').addEventListener('change', onPick);

  function render(extra) {
    $('status').hidden = false;
    const finished = sent + skipped + failed;
    $('count').textContent = total + '枚中 ' + finished + '枚 送信済み';
    $('bar').style.width = (total ? Math.round(finished / total * 100) : 0) + '%';
    const notes = [];
    if (running) {
      const left = total - finished;
      if (runDone >= 2 && left > 0) {
        const min = Math.ceil((Date.now() - runStart) / runDone * left / 60000);
        notes.push('残り約' + min + '分');
      }
      notes.push('送信中です。この画面を開いたままにしてください。ほかのアプリに切り替えると一時停止しますが、戻ってくれば続きから送ります。');
    }
    if (skipped) notes.push('送信済みの写真 ' + skipped + '枚は、重ねて送らずにとばしました。');
    if (failed) notes.push('送れなかった写真が ' + failed + '枚あります。電波のよい場所で、同じ写真をもう一度選んでください（送信済みの分は自動でとばします）。');
    if (extra) notes.push(extra);
    $('note').textContent = notes.join('\n');
    $('note').style.whiteSpace = 'pre-line';
  }

  async function run() {
    running = true;
    runStart = Date.now(); runDone = 0;
    await keepAwake();
    render();

    let stopped = false;
    async function worker() {
      while (queue.length && !stopped) {
        const file = queue.shift();
        const result = await sendOne(file);
        if (result === 'stop') { stopped = true; failed++; continue; }
        if (result === 'sent') { sent++; batchCount++; }
        else if (result === 'skip') skipped++;
        else failed++;
        runDone++;
        render();
      }
    }
    await Promise.all(Array.from({ length: PARALLEL }, worker));
    if (stopped) { failed += queue.length; queue.length = 0; }

    running = false;
    try { if (wakeLock) { await wakeLock.release(); wakeLock = null; } } catch (e) {}
    await finishBatch();
    render();
    if (!failed && sent + skipped === total) {
      showInfo('送信が終わりました。ありがとうございました！ 続けて送るときは、もう一度ボタンを押してください。');
      $('info').querySelector('p').className = 'msg done';
    }
  }

  async function keepAwake() {
    try { if ('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  // ほかのアプリから戻ってきたら、画面の自動消灯防止をかけ直す（送信は自動で続きから再開）
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && running) { wakeLock = null; keepAwake(); render(); }
  });

  async function sendOne(file) {
    if (file.type && !/^image\//.test(file.type)) return 'fail';
    if (file.size > MAX_BYTES) return 'fail';

    const original = await file.arrayBuffer();
    const hash = toHex(await crypto.subtle.digest('SHA-256', original));
    if (sentSet().has(hash)) return 'skip';

    const cleaned = stripGps(original).buf; // 位置情報だけ消す（画質はそのまま）
    const data = await toBase64(cleaned);
    const body = { action: 'upload', batchId, hash, filename: file.name, mimeType: file.type || 'image/jpeg', data };

    for (let i = 0; i <= RETRY_WAIT.length; i++) {
      try {
        const r = await post(body);
        if (r.ok) { markSent(hash); return r.dup ? 'skip' : 'sent'; }
        if (r.error === 'closed' || r.error === 'auth') {
          showInfo(r.error === 'closed' ? '受付期間が終わったため、送信を止めました。' : 'このQRコードは使えなくなっています。', true);
          return 'stop';
        }
        if (r.error !== 'server') return 'fail';
      } catch (e) { /* 通信エラーは待ってからやり直す */ }
      if (i < RETRY_WAIT.length) {
        render('通信がうまくいかないので、' + RETRY_WAIT[i] + '秒後にもう一度送ります…');
        await sleep(RETRY_WAIT[i] * 1000);
      }
    }
    return 'fail';
  }

  // 1回の送信が終わったら管理者に通知（枚数をまとめて1通）
  async function finishBatch() {
    if (!batchCount) return;
    const id = batchId;
    batchId = newBatchId(); batchCount = 0;
    try { await post({ action: 'done', batchId: id }); } catch (e) { /* 届かなくても1時間ごとの見回りで通知される */ }
  }

  // 送信途中で画面を閉じられたときも、できるだけ通知の合図を送る
  window.addEventListener('pagehide', () => {
    if (!batchCount) return;
    try {
      navigator.sendBeacon(GAS_URL, new Blob([JSON.stringify({ key, action: 'done', batchId })], { type: 'text/plain' }));
    } catch (e) {}
  });

  function toHex(buf) { return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join(''); }
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
  function toBase64(buf) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(String(fr.result).split(',')[1]);
      fr.onerror = reject;
      fr.readAsDataURL(new Blob([buf]));
    });
  }

  start();
})();
</script>
</body>

  const queue = [];
  let running = false;
  let total = 0, sent = 0, skipped = 0, failed = 0;
  let batchId = newBatchId();
  let batchCount = 0;
  let wakeLock = null;

  function newBatchId() {
    const a = new Uint8Array(10); crypto.getRandomValues(a);
    return Array.from(a, x => (x % 36).toString(36)).join('');
  }

  function sentSet() {
    try { return new Set(JSON.parse(localStorage.getItem('sent') || '[]')); } catch (e) { return new Set(); }
  }
  function markSent(h) {
    try { const s = sentSet(); s.add(h); localStorage.setItem('sent', JSON.stringify([...s])); } catch (e) {}
  }

  function showInfo(text, isErr) {
    $('info').hidden = false;
    $('infoText').textContent = text;
    $('infoText').className = 'msg' + (isErr ? ' err' : '');
  }

  async function post(body) {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ key }, body))
    });
    return res.json();
  }

  async function start() {
    if (!key) {
      showInfo('このページは、配られたQRコードから開いてください。', true);
      return;
    }
    try {
      const r = await post({ action: 'ping' });
      if (!r.ok) {
        showInfo(r.error === 'closed' ? '受付期間外のため、いまは写真を送れません。'
                                      : 'このQRコードは使えなくなっています。配った人に確認してください。', true);
        return;
      }
    } catch (e) {
      // 電波が悪いだけの可能性があるので、ボタンは出しておく
    }
    $('actions').hidden = false;
  }

  function onPick(ev) {
    const files = Array.from(ev.target.files || []);
    ev.target.value = '';
    if (!files.length) return;
    files.forEach(f => queue.push(f));
    total += files.length;
    $('info').hidden = true;
    render();
    if (!running) run();
  }
  $('pick').addEventListener('change', onPick);
  $('camera').addEventListener('change', onPick);

  function render(extra) {
    $('status').hidden = false;
    const finished = sent + skipped + failed;
    $('count').textContent = total + '枚中 ' + finished + '枚 送信済み';
    $('bar').style.width = (total ? Math.round(finished / total * 100) : 0) + '%';
    const notes = [];
    if (running) notes.push('送信中です。終わるまでこの画面を開いたままにしてください。');
    if (skipped) notes.push('送信済みの写真 ' + skipped + '枚は、重ねて送らずにとばしました。');
    if (failed) notes.push('送れなかった写真が ' + failed + '枚あります。電波のよい場所で、同じ写真をもう一度選んでください（送信済みの分は自動でとばします）。');
    if (extra) notes.push(extra);
    $('note').textContent = notes.join('\n');
    $('note').style.whiteSpace = 'pre-line';
  }

  async function run() {
    running = true;
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    render();

    while (queue.length) {
      const file = queue.shift();
      const result = await sendOne(file);
      if (result === 'stop') { failed += queue.length + 1; queue.length = 0; break; }
      if (result === 'sent') { sent++; batchCount++; }
      else if (result === 'skip') skipped++;
      else failed++;
      render();
    }

    running = false;
    try { if (wakeLock) { await wakeLock.release(); wakeLock = null; } } catch (e) {}
    await finishBatch();
    render();
    if (!failed && sent + skipped === total) {
      showInfo('送信が終わりました。ありがとうございました！ 続けて送るときは、もう一度ボタンを押してください。');
      $('info').querySelector('p').className = 'msg done';
    }
  }

  async function sendOne(file) {
    if (file.type && !/^image\//.test(file.type)) return 'fail';
    if (file.size > MAX_BYTES) return 'fail';

    const original = await file.arrayBuffer();
    const hash = toHex(await crypto.subtle.digest('SHA-256', original));
    if (sentSet().has(hash)) return 'skip';

    const cleaned = stripGps(original).buf; // 位置情報だけ消す（画質はそのまま）
    const data = await toBase64(cleaned);
    const body = { action: 'upload', batchId, hash, filename: file.name, mimeType: file.type || 'image/jpeg', data };

    for (let i = 0; i <= RETRY_WAIT.length; i++) {
      try {
        const r = await post(body);
        if (r.ok) { markSent(hash); return r.dup ? 'skip' : 'sent'; }
        if (r.error === 'closed' || r.error === 'auth') {
          showInfo(r.error === 'closed' ? '受付期間が終わったため、送信を止めました。' : 'このQRコードは使えなくなっています。', true);
          return 'stop';
        }
        if (r.error !== 'server') return 'fail';
      } catch (e) { /* 通信エラーは待ってからやり直す */ }
      if (i < RETRY_WAIT.length) {
        render('通信がうまくいかないので、' + RETRY_WAIT[i] + '秒後にもう一度送ります…');
        await sleep(RETRY_WAIT[i] * 1000);
      }
    }
    return 'fail';
  }

  // 1回の送信が終わったら管理者に通知（枚数をまとめて1通）
  async function finishBatch() {
    if (!batchCount) return;
    const id = batchId;
    batchId = newBatchId(); batchCount = 0;
    try { await post({ action: 'done', batchId: id }); } catch (e) { /* 届かなくても1時間ごとの見回りで通知される */ }
  }

  // 送信途中で画面を閉じられたときも、できるだけ通知の合図を送る
  window.addEventListener('pagehide', () => {
    if (!batchCount) return;
    try {
      navigator.sendBeacon(GAS_URL, new Blob([JSON.stringify({ key, action: 'done', batchId })], { type: 'text/plain' }));
    } catch (e) {}
  });

  function toHex(buf) { return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join(''); }
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
  function toBase64(buf) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(String(fr.result).split(',')[1]);
      fr.onerror = reject;
      fr.readAsDataURL(new Blob([buf]));
    });
  }

  start();
})();
</script>
</body>
</html>
